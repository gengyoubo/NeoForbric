tasks.register('forgeJeiProbe', JavaExec) {
    group = 'verification'
    description = 'Load the specified Forge JEI and bundled config through native FML in a headless diagnostic process.'
    dependsOn 'prepareForgeClient', ':forge-runtime:jar', ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.forge.ForgeModProbe'
    maxHeapSize = '3g'
    def side = providers.gradleProperty('forgeProbeSide').getOrElse('server')
    def input = file(providers.gradleProperty('forgeReferenceMod').getOrElse('run/client/mods/jei-1.21.1-forge-19.57.0.451.jar'))
    def output = layout.buildDirectory.dir("forge-jei/${side}").get().asFile
    def mods = new File(output, 'mods')
    args layout.buildDirectory.file('forge-client/forge-runtime.json').get().asFile.absolutePath,
            layout.buildDirectory.file('minecraft-client/runtime.json').get().asFile.absolutePath,
            project(':forge-runtime').tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
            mods.absolutePath, output.absolutePath, side
    doFirst {
        if (!input.isFile()) throw new GradleException("Missing Forge reference JAR: ${input}")
        mods.mkdirs()
        java.nio.file.Files.copy(input.toPath(), new File(mods, input.name).toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

