tasks.register('prepareFabricClientProbe', Sync) {
    dependsOn ':probes:fabric-client:remapJar'
    from project(':probes:fabric-client').layout.buildDirectory.file('libs/fabric-client-intermediary.jar')
    into layout.buildDirectory.dir('minecraft-client/mods')
}
def clientDirectory = providers.gradleProperty('clientRunDir').isPresent() ? file(providers.gradleProperty('clientRunDir').get()) : providers.gradleProperty('neoForgeWorldProbe').getOrElse('false') == 'true'
        ? layout.buildDirectory.dir('neoforge-world/run').get().asFile : layout.projectDirectory.dir('run/client').asFile
def clientModsDirectory = providers.gradleProperty('clientModsDir').isPresent()
        ? file(providers.gradleProperty('clientModsDir').get()) : new File(clientDirectory, 'mods')
def clientTestMod = providers.gradleProperty('clientTestMod').getOrElse('false') == 'true'
def forgeRequested = providers.gradleProperty('forgeProfile').getOrElse('false') == 'true'

// Dual descriptors can include unused build templates. Exclusive descriptors
// identify which native runtime this directory actually requires.
def nativeModDescriptors = (clientModsDirectory.listFiles() ?: []).findAll { it.isFile() && it.name.endsWith('.jar') }.collect { mod ->
    new java.util.jar.JarFile(mod).withCloseable { jar ->
        [forge: jar.getJarEntry('META-INF/mods.toml') != null,
         neoForge: jar.getJarEntry('META-INF/neoforge.mods.toml') != null,
         other: jar.getJarEntry('fabric.mod.json') != null || jar.getJarEntry('neoforbric.mod.json') != null]
    }
}
def hasExclusiveForge = nativeModDescriptors.any { it.forge && !it.neoForge && !it.other }
def hasExclusiveNeoForge = nativeModDescriptors.any { it.neoForge && !it.forge && !it.other }
def neoForgeProfile = providers.gradleProperty('neoForgeProfile').isPresent()
        ? providers.gradleProperty('neoForgeProfile').get() == 'true'
        : (!forgeRequested && (hasExclusiveNeoForge || (!hasExclusiveForge && nativeModDescriptors.any { it.neoForge && !it.other })))
def forgeProfile = providers.gradleProperty('forgeProfile').isPresent() ? forgeRequested : (!neoForgeProfile && hasExclusiveForge)
if (forgeProfile && neoForgeProfile) throw new GradleException('Choose one of forgeProfile and neoForgeProfile')
tasks.register('prepareClientUi') {
    dependsOn ':client-ui:jar'
    def uiJar = project(':client-ui').tasks.named('jar').flatMap { it.archiveFile }
    def uiOutput = layout.buildDirectory.file('minecraft-client/client-ui.jar')
    inputs.file(uiJar)
    outputs.file(uiOutput)
    doLast {
        java.nio.file.Files.copy(uiJar.get().asFile.toPath(), uiOutput.get().asFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
tasks.register('prepareClient') {
    dependsOn 'prepareClientUi'
    if (clientTestMod) dependsOn 'prepareFabricClientProbe'
    def probeJar = project(':probes:fabric-client').layout.buildDirectory.file('libs/fabric-client-intermediary.jar')
    doLast {
        clientDirectory.mkdirs()
        new File(clientDirectory, 'mods').mkdirs()
        if (clientTestMod) java.nio.file.Files.copy(probeJar.get().asFile.toPath(), new File(clientDirectory, 'mods/fabric-client-intermediary.jar').toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        def options = new File(clientDirectory, 'options.txt')
        if (!options.exists()) options.setText('onboardAccessibility:false\nrenderDistance:6\nsimulationDistance:6\n', 'UTF-8')
    }
}
tasks.register('runClient', JavaExec) {
    description = 'Run a Windows x64 Minecraft 1.21.1 client with an offline development profile.'
    group = 'application'
    dependsOn 'prepareClient', ':loader:classes'
    if (forgeProfile) {
        dependsOn 'prepareForgeClient', ':forge-runtime:jar'
        systemProperty 'neoforbric.forge.runtime', layout.buildDirectory.file('forge-client/forge-runtime.json').get().asFile.absolutePath
        systemProperty 'neoforbric.forge.bridge', project(':forge-runtime').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    }
    if (neoForgeProfile) {
        dependsOn 'prepareNeoForgeClient', ':neoforge-runtime:jar'
        systemProperty 'neoforbric.neoforge.runtime', layout.buildDirectory.file('neoforge-client/neoforge-runtime.json').get().asFile.absolutePath
        systemProperty 'neoforbric.neoforge.bridge', project(':neoforge-runtime').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        systemProperty 'neoforbric.neoforge.worldProbe', providers.gradleProperty('neoForgeWorldProbe').getOrElse('false')
        jvmArgs '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED', '--add-opens=java.base/java.util.jar=ALL-UNNAMED',
                '--add-exports=java.base/sun.security.util=ALL-UNNAMED'
    }
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.bootstrap.Main'
    maxHeapSize = providers.gradleProperty('clientHeap').getOrElse('10g')
    workingDir = clientDirectory
    args '--minecraft-client', '--runtime', layout.buildDirectory.file('minecraft-client/runtime.json').get().asFile.absolutePath,
            '--mods', clientModsDirectory.absolutePath, '--client-ui', layout.buildDirectory.file('minecraft-client/client-ui.jar').get().asFile.absolutePath,
            '--audit', new File(clientDirectory, 'audit.json').absolutePath
    if (forgeProfile && providers.gradleProperty('forgeClientProbe').getOrElse('false') == 'true') args '--verify', 'org.neoforbric.forge.runtime.ForgeClientProbe'
    else if (neoForgeProfile) args '--verify', 'org.neoforbric.neoforge.runtime.NeoForgeProbe'
    else if (providers.gradleProperty('sscRenderProbe').isPresent()) args '--verify', 'org.neoforbric.client.SscRenderProbe'
    else if (clientTestMod) args '--verify', 'demo.clientprobe.ClientProbe'
    if (providers.gradleProperty('clientProbeFrames').isPresent() && !providers.gradleProperty('sscRenderProbe').isPresent()) args '--stop-after-frames', providers.gradleProperty('clientProbeFrames').get()
    if (providers.gradleProperty('clientModsProbe').getOrElse('false') == 'true') systemProperty 'neoforbric.probe.mods', 'true'
    if (providers.gradleProperty('fabricPlainProfile').getOrElse('false') == 'true') systemProperty 'neoforbric.fabric.plain', 'true'
    systemProperty 'neoforbric.debug', providers.gradleProperty('clientDebug').getOrElse('false')
    systemProperty 'neoforbric.assets.fullVerification', providers.gradleProperty('clientFullAssetVerification').getOrElse('false')
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    def username = providers.gradleProperty('clientUsername').getOrElse('NeoForbricDev')
    args '--', '--username', username, '--uuid', java.util.UUID.nameUUIDFromBytes(('OfflinePlayer:' + username).getBytes('UTF-8')).toString(),
            '--accessToken', '0', '--userType', 'legacy', '--version', '1.21.1', '--versionType', 'release',
            '--gameDir', clientDirectory.absolutePath, '--assetsDir', layout.buildDirectory.dir('minecraft-client/assets').get().asFile.absolutePath,
            '--assetIndex', '17', '--width', '960', '--height', '540'
}

