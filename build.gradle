allprojects {
    group = 'org.neoforbric'
    version = '0.1.0-SNAPSHOT'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
    }
}

subprojects {
    if (name != 'fixtures' && name != 'probes') {
        apply plugin: 'java-library'
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(21) }
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        dependencyLocking { lockAllConfigurations() }
    }
}

tasks.register('prepareMinecraft', JavaExec) {
    dependsOn ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.minecraft.GamePreparation'
    maxHeapSize = '2g'
    args 'prepare', layout.buildDirectory.dir('minecraft').get().asFile.absolutePath
}

tasks.register('prepareMinecraftClient', JavaExec) {
    dependsOn ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.minecraft.ClientPreparation'
    maxHeapSize = '2g'
    args layout.buildDirectory.dir('minecraft-client').get().asFile.absolutePath
}

tasks.register('prepareFabricClientProbe', Sync) {
    dependsOn ':probes:fabric-client:remapJar'
    from project(':probes:fabric-client').layout.buildDirectory.file('libs/fabric-client-intermediary.jar')
    into layout.buildDirectory.dir('minecraft-client/mods')
}
def clientDirectory = layout.projectDirectory.dir('run/client').asFile
tasks.register('prepareClient') {
    dependsOn 'prepareFabricClientProbe'
    doLast {
        clientDirectory.mkdirs()
        def options = new File(clientDirectory, 'options.txt')
        if (!options.exists()) options.setText('onboardAccessibility:false\nrenderDistance:6\nsimulationDistance:6\n', 'UTF-8')
    }
}
tasks.register('runClient', JavaExec) {
    description = 'Run a Windows x64 Minecraft 1.21.1 client with an offline development profile.'
    group = 'application'
    dependsOn 'prepareClient', ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.bootstrap.Main'
    maxHeapSize = '2g'
    workingDir = clientDirectory
    args '--minecraft-client', '--runtime', layout.buildDirectory.file('minecraft-client/runtime.json').get().asFile.absolutePath,
            '--mods', layout.buildDirectory.dir('minecraft-client/mods').get().asFile.absolutePath,
            '--verify', 'demo.clientprobe.ClientProbe', '--audit', new File(clientDirectory, 'audit.json').absolutePath
    if (providers.gradleProperty('clientProbeFrames').isPresent()) args '--stop-after-frames', providers.gradleProperty('clientProbeFrames').get()
    def username = providers.gradleProperty('clientUsername').getOrElse('NeoForbricDev')
    args '--', '--username', username, '--uuid', java.util.UUID.nameUUIDFromBytes(('OfflinePlayer:' + username).getBytes('UTF-8')).toString(),
            '--accessToken', '0', '--userType', 'legacy', '--version', '1.21.1', '--versionType', 'release',
            '--gameDir', clientDirectory.absolutePath, '--assetsDir', layout.buildDirectory.dir('minecraft-client/assets').get().asFile.absolutePath,
            '--assetIndex', '17', '--width', '960', '--height', '540'
}

tasks.register('prepareFabricProbe', Sync) {
    dependsOn ':probes:fabric-item:remapJar'
    from project(':probes:fabric-item').layout.buildDirectory.file('libs/fabric-item-intermediary.jar')
    into layout.buildDirectory.dir('minecraft/mods')
}

tasks.register('runMinecraftProbe', JavaExec) {
    dependsOn 'prepareFabricProbe', ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.bootstrap.Main'
    maxHeapSize = '2g'
    workingDir = layout.buildDirectory.dir('minecraft/run').get().asFile
    doFirst { workingDir.mkdirs() }
    args '--minecraft-server', '--runtime', layout.buildDirectory.file('minecraft/runtime.json').get().asFile.absolutePath,
            '--mods', layout.buildDirectory.dir('minecraft/mods').get().asFile.absolutePath,
            '--verify', 'demo.fabricprobe.ItemProbe', '--audit', layout.buildDirectory.file('minecraft/audit.json').get().asFile.absolutePath,
            '--', '--initSettings'
}

def serverDirectory = layout.projectDirectory.dir('run/server').asFile
def acceptedEula = providers.gradleProperty('acceptEula').map { it == 'true' }.orElse(false)
tasks.register('prepareServer') {
    dependsOn 'prepareFabricProbe'
    doLast {
        serverDirectory.mkdirs()
        def eula = new File(serverDirectory, 'eula.txt')
        if (acceptedEula.get()) eula.setText('# Accepted explicitly with -PacceptEula=true\neula=true\n', 'UTF-8')
        else if (!eula.exists()) eula.setText('eula=false\n', 'UTF-8')
        def properties = new File(serverDirectory, 'server.properties')
        if (!properties.exists()) properties.setText('server-ip=127.0.0.1\nserver-port=25565\nmax-players=20\nview-distance=6\nsimulation-distance=6\n', 'UTF-8')
    }
}
tasks.register('runServer', JavaExec) {
    description = 'Run a persistent Minecraft 1.21.1 dedicated server with the Fabric item probe.'
    group = 'application'
    dependsOn 'prepareServer', ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.bootstrap.Main'
    maxHeapSize = '2g'
    workingDir = serverDirectory
    standardInput = System.in
    args '--minecraft-server', '--run-server', '--runtime', layout.buildDirectory.file('minecraft/runtime.json').get().asFile.absolutePath,
            '--mods', layout.buildDirectory.dir('minecraft/mods').get().asFile.absolutePath,
            '--verify', 'demo.fabricprobe.ItemProbe', '--audit', new File(serverDirectory, 'audit.json').absolutePath
    if (providers.gradleProperty('serverProbeTicks').isPresent()) args '--stop-after-ticks', providers.gradleProperty('serverProbeTicks').get()
    args '--', 'nogui'
    if (providers.gradleProperty('serverPort').isPresent()) args '--port', providers.gradleProperty('serverPort').get()
}

def fixtureMods = [project(':fixtures:mod-a'), project(':fixtures:mod-b'), project(':fixtures:mod-c')]
tasks.register('prepareFixture', Sync) {
    dependsOn fixtureMods.collect { it.tasks.named('jar') }, project(':fixtures:game').tasks.named('jar')
    from fixtureMods.collect { it.tasks.named('jar') }
    into layout.buildDirectory.dir('fixture/mods')
}

tasks.register('runFixture', JavaExec) {
    dependsOn 'prepareFixture', ':loader:classes'
    javaLauncher = project(':loader').javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    classpath = project(':loader').sourceSets.main.runtimeClasspath
    mainClass = 'org.neoforbric.bootstrap.Main'
    args = ['--fixture', '--game', project(':fixtures:game').tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
            '--mods', layout.buildDirectory.dir('fixture/mods').get().asFile.absolutePath,
            '--main', 'demo.game.GameMain', '--audit', layout.buildDirectory.file('fixture/audit.json').get().asFile.absolutePath]
}
