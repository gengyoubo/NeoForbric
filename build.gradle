def serverDirectory = layout.projectDirectory.dir('run/server').asFile
def acceptedEula = providers.gradleProperty('acceptEula').map { it == 'true' }.orElse(false)
tasks.register('prepareServer') {
    dependsOn 'prepareFabricProbe'
    doLast {
        serverDirectory.mkdirs()
        def eula = new File(serverDirectory, 'eula.txt')
        if (acceptedEula.get()) eula.setText('# Accepted explicitly with -PacceptEula=true\neula=true\n', 'UTF-8')
        else if (!eula.exists()) eula.setText('eula=false\n', 'UTF-8')
        def properties = new File(serverDirectory, 'server.properties')
        if (!properties.exists()) properties.setText('server-ip=127.0.0.1\nserver-port=25565\nmax-players=20\nview-distance=6\nsimulation-distance=6\n', 'UTF-8')
    }
}
