ext.fabricLoaderVersion = '0.19.5'

tasks.register('assembleInstaller') {
    group = 'distribution'
    description = 'Build the standalone neoforbric-installer.jar in the project root.'
    dependsOn ':installer:jar'
    doLast {
        java.nio.file.Files.copy(project(':installer').tasks.named('jar').get().archiveFile.get().asFile.toPath(),
                layout.projectDirectory.file('neoforbric-installer.jar').asFile.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}

allprojects {
    group = 'org.neoforbric'
    version = providers.gradleProperty('NeoForbricVersion').get()
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/'; content { includeGroup 'net.fabricmc' } }
    }
}

subprojects {
    if (name != 'fixtures' && name != 'probes') {
        apply plugin: 'java-library'
        java {
            toolchain { languageVersion = JavaLanguageVersion.of(21) }
            withSourcesJar()
        }
        tasks.withType(JavaCompile).configureEach {
            options.encoding = 'UTF-8'
            options.release = 21
        }
        tasks.withType(AbstractArchiveTask).configureEach {
            preserveFileTimestamps = false
            reproducibleFileOrder = true
        }
        dependencyLocking { lockAllConfigurations() }
    }
}

