import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedComponentResult
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact
import org.gradle.language.java.artifact.JavadocArtifact

plugins { id 'application' }
application { mainClass = 'org.neoforbric.bootstrap.Main' }
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.ow2.asm:asm:9.7.1'
    implementation 'org.ow2.asm:asm-commons:9.7.1'
    implementation 'org.ow2.asm:asm-tree:9.7.1'
    implementation 'org.ow2.asm:asm-util:9.7.1'
    implementation 'net.fabricmc:tiny-remapper:0.10.4'
    implementation 'net.fabricmc:mapping-io:0.6.1'
    implementation 'net.fabricmc:fabric-loader:0.16.10@jar'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn ':prepareFixture'
    systemProperty 'fixture.game', project(':fixtures:game').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'fixture.mods', rootProject.layout.buildDirectory.dir('fixture/mods').get().asFile.absolutePath
    systemProperty 'loader.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
}

sourceSets {
    minecraftTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    minecraftTestImplementation.extendsFrom testImplementation
    minecraftTestRuntimeOnly.extendsFrom testRuntimeOnly
}
tasks.register('minecraftTest', Test) {
    description = 'Fork real Minecraft 1.21.1 and exercise Fabric entrypoints and registry identity.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.minecraftTest.output.classesDirs
    classpath = sourceSets.minecraftTest.runtimeClasspath
    exclude '**/MinecraftServerRuntimeTest.class'
    exclude '**/MinecraftClientRuntimeTest.class'
    dependsOn ':prepareFabricProbe'
    systemProperty 'minecraft.runtime', rootProject.layout.buildDirectory.file('minecraft/runtime.json').get().asFile.absolutePath
    systemProperty 'minecraft.mods', rootProject.layout.buildDirectory.dir('minecraft/mods').get().asFile.absolutePath
    systemProperty 'loader.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
}

tasks.register('minecraftServerTest', Test) {
    description = 'Fork dedicated servers to verify ticks, console stop, crash handling and world save/reload.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.minecraftTest.output.classesDirs
    classpath = sourceSets.minecraftTest.runtimeClasspath
    include '**/MinecraftServerRuntimeTest.class'
    dependsOn ':prepareFabricProbe'
    systemProperty 'minecraft.runtime', rootProject.layout.buildDirectory.file('minecraft/runtime.json').get().asFile.absolutePath
    systemProperty 'minecraft.mods', rootProject.layout.buildDirectory.dir('minecraft/mods').get().asFile.absolutePath
    systemProperty 'loader.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
    systemProperty 'minecraft.acceptEula', providers.gradleProperty('acceptEula').getOrElse('false')
}

tasks.register('minecraftClientTest', Test) {
    description = 'Open actual Windows x64 clients, render the main menu and verify failure auditing.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.minecraftTest.output.classesDirs
    classpath = sourceSets.minecraftTest.runtimeClasspath
    include '**/MinecraftClientRuntimeTest.class'
    dependsOn ':prepareFabricClientProbe', ':prepareClientUi'
    systemProperty 'minecraft.clientRuntime', rootProject.layout.buildDirectory.file('minecraft-client/runtime.json').get().asFile.absolutePath
    systemProperty 'minecraft.clientUi', rootProject.layout.buildDirectory.file('minecraft-client/client-ui.jar').get().asFile.absolutePath
    systemProperty 'minecraft.clientEvidence', layout.buildDirectory.dir('client-evidence').get().asFile.absolutePath
    systemProperty 'minecraft.clientMods', rootProject.layout.buildDirectory.dir('minecraft-client/mods').get().asFile.absolutePath
    systemProperty 'minecraft.clientAssets', rootProject.layout.buildDirectory.dir('minecraft-client/assets').get().asFile.absolutePath
    systemProperty 'loader.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
}

// IDE imports resolve auxiliary artifacts that ordinary compilation never requests.
// Resolve exactly the external components selected by the locked main/test classpaths.
tasks.register('verifyIdeArtifacts') {
    group = 'verification'
    description = 'Resolve and verify dependency sources and Javadoc used by IDE imports.'
    def classpaths = [configurations.compileClasspath, configurations.runtimeClasspath,
                      configurations.testCompileClasspath, configurations.testRuntimeClasspath]
    def dependencyHandler = dependencies
    doLast {
        def components = classpaths.collectMany { configuration ->
            configuration.incoming.artifacts.artifacts.collect { it.id.componentIdentifier }
        }.findAll { it instanceof ModuleComponentIdentifier }.toSet()
        def result = dependencyHandler.createArtifactResolutionQuery().forComponents(components)
                .withArtifacts(JvmLibrary, SourcesArtifact, JavadocArtifact).execute()
        result.components.findAll { it instanceof UnresolvedComponentResult }.each {
            throw new GradleException("Cannot resolve IDE artifacts for ${it.id}", it.failure)
        }
        int verified = 0
        result.resolvedComponents.each { component ->
            [SourcesArtifact, JavadocArtifact].each { type ->
                component.getArtifacts(type).each { artifact ->
                    if (!(artifact instanceof ResolvedArtifactResult))
                        throw new GradleException("Cannot resolve IDE artifact ${artifact.id}", artifact.failure)
                    artifact.file // Access invokes Gradle dependency verification, as in IDE import.
                    verified++
                }
            }
        }
        logger.lifecycle("Verified ${verified} IDE source/Javadoc artifacts for ${components.size()} locked dependencies.")
    }
}
