import org.gradle.api.artifacts.component.ModuleComponentIdentifier
import org.gradle.api.artifacts.result.ResolvedArtifactResult
import org.gradle.api.artifacts.result.UnresolvedComponentResult
import org.gradle.jvm.JvmLibrary
import org.gradle.language.base.artifact.SourcesArtifact
import org.gradle.language.java.artifact.JavadocArtifact

plugins { id 'application' }
application { mainClass = 'org.neoforbric.bootstrap.Main' }
dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'org.tomlj:tomlj:1.1.1'
    implementation 'org.ow2.asm:asm:9.7.1'
    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
tasks.named('test', Test) {
    useJUnitPlatform()
    dependsOn ':prepareFixture'
    systemProperty 'fixture.game', project(':fixtures:game').tasks.named('jar').get().archiveFile.get().asFile.absolutePath
    systemProperty 'fixture.mods', rootProject.layout.buildDirectory.dir('fixture/mods').get().asFile.absolutePath
    systemProperty 'loader.runtimeClasspath', sourceSets.main.runtimeClasspath.asPath
}

// IDE imports resolve auxiliary artifacts that ordinary compilation never requests.
// Resolve exactly the external components selected by the locked main/test classpaths.
tasks.register('verifyIdeArtifacts') {
    group = 'verification'
    description = 'Resolve and verify dependency sources and Javadoc used by IDE imports.'
    def classpaths = [configurations.compileClasspath, configurations.runtimeClasspath,
                      configurations.testCompileClasspath, configurations.testRuntimeClasspath]
    def dependencyHandler = dependencies
    doLast {
        def components = classpaths.collectMany { configuration ->
            configuration.incoming.artifacts.artifacts.collect { it.id.componentIdentifier }
        }.findAll { it instanceof ModuleComponentIdentifier }.toSet()
        def result = dependencyHandler.createArtifactResolutionQuery().forComponents(components)
                .withArtifacts(JvmLibrary, SourcesArtifact, JavadocArtifact).execute()
        result.components.findAll { it instanceof UnresolvedComponentResult }.each {
            throw new GradleException("Cannot resolve IDE artifacts for ${it.id}", it.failure)
        }
        int verified = 0
        result.resolvedComponents.each { component ->
            [SourcesArtifact, JavadocArtifact].each { type ->
                component.getArtifacts(type).each { artifact ->
                    if (!(artifact instanceof ResolvedArtifactResult))
                        throw new GradleException("Cannot resolve IDE artifact ${artifact.id}", artifact.failure)
                    artifact.file // Access invokes Gradle dependency verification, as in IDE import.
                    verified++
                }
            }
        }
        logger.lifecycle("Verified ${verified} IDE source/Javadoc artifacts for ${components.size()} locked dependencies.")
    }
}
